<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>kimoanh.tiengnhat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Bảng màu lấy trực tiếp từ bộ slide PowerPoint đã làm (đo pixel
   thật từ ảnh render), không phải màu tự chọn — để giữ đúng
   nhận diện thương hiệu xuyên suốt tài liệu học + web luyện tập.
   ============================================================ */
:root {
  --navy: #1b4a7a;
  --navy-deep: #123152;
  --orange: #dd6f0c;
  --orange-soft: #f2934a;
  --peach: #fbe7d3;
  --peach-deep: #f6d3ab;
  --terracotta: #bd6f4f;
  --cream: #fbf8f4;
  --ink: #2a2018;
  --good: #2f7d4f;
  --bad: #b8462f;
  --font-head: "Zilla Slab", Georgia, serif;
  --font-ui: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-jp: "Noto Sans JP", var(--font-ui);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.app-shell {
  width: 100%;
  max-width: 760px;
  padding: 28px 20px 64px;
  margin: 0 auto;
}

/* ---------- Header / thương hiệu ---------- */
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.brand-icon {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}
.brand-text .brand-title {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 1.35rem;
  color: var(--navy-deep);
  line-height: 1.1;
}
.brand-text .brand-sub {
  font-size: 0.8rem;
  color: var(--terracotta);
  letter-spacing: 0.02em;
}

/* ---------- Thẻ / khung viền (giữ đúng phong cách vở học) ---------- */
.card {
  background: #fff;
  border: 2px solid var(--terracotta);
  border-radius: 22px;
  padding: 28px 26px;
  position: relative;
}
.card + .card { margin-top: 18px; }

.pill-header {
  display: inline-block;
  background: var(--peach);
  border: 2px solid var(--orange-soft);
  border-radius: 999px;
  padding: 6px 20px;
  font-family: var(--font-head);
  font-weight: 600;
  color: var(--navy-deep);
  margin-bottom: 18px;
}

/* ---------- Form đăng nhập ---------- */
.login-card { max-width: 420px; margin: 6vh auto 0; }
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--navy-deep);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #d8cdbf;
  border-radius: 10px;
  font-size: 1rem;
  font-family: var(--font-ui);
}
.field input:focus {
  outline: none;
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(221, 111, 12, 0.15);
}
.hint-box {
  background: var(--peach);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 0.82rem;
  color: var(--navy-deep);
  margin-top: 14px;
  line-height: 1.5;
}
.error-msg {
  color: var(--bad);
  font-size: 0.85rem;
  margin-top: 6px;
  min-height: 1em;
}

/* ---------- Nút bấm ---------- */
.btn {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 0.95rem;
  border: none;
  border-radius: 999px;
  padding: 12px 26px;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { background: #c8620a; }
.btn-primary:disabled {
  background: #e5d9cb;
  color: #a99a86;
  cursor: not-allowed;
}
.btn-ghost {
  background: transparent;
  color: var(--navy);
  border: 1.5px solid var(--navy);
}
.btn-ghost:hover { background: rgba(27, 74, 122, 0.06); }
.btn-block { width: 100%; }

/* ---------- Lưới chọn Unit ---------- */
.unit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}
.unit-tile {
  border: 2px solid var(--terracotta);
  border-radius: 16px;
  padding: 16px 14px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  transition: transform 0.1s ease, box-shadow 0.15s ease;
}
.unit-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.08); }
.unit-tile .u-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--orange);
  color: #fff;
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 8px;
}
.unit-tile .u-name { font-weight: 700; color: var(--navy-deep); font-size: 0.95rem; }
.unit-tile .u-range { font-size: 0.75rem; color: var(--terracotta); margin-top: 2px; }

.unit-tile.locked {
  cursor: not-allowed;
  opacity: 0.55;
  background: repeating-linear-gradient(135deg, #fff, #fff 10px, #faf6f0 10px, #faf6f0 20px);
}
.unit-tile.locked .u-num { background: #cbb9a4; }
.badge-soon {
  display: inline-block;
  font-size: 0.68rem;
  background: var(--peach);
  color: var(--terracotta);
  border-radius: 999px;
  padding: 2px 9px;
  margin-top: 6px;
  font-weight: 600;
}

/* ---------- Chọn đề ---------- */
.de-row { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.de-tile {
  flex: 1;
  min-width: 160px;
  border: 2px solid var(--terracotta);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  background: #fff;
  cursor: pointer;
}
.de-tile:hover { background: var(--peach); }
.de-tile.locked { cursor: not-allowed; opacity: 0.5; }
.de-tile .de-title { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; color: var(--navy-deep); }
.de-tile .de-meta { font-size: 0.8rem; color: var(--terracotta); margin-top: 4px; }

/* ---------- Màn hình làm bài ---------- */
.progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.progress-track {
  flex: 1;
  height: 8px;
  background: var(--peach);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--orange);
  border-radius: 999px;
  transition: width 0.25s ease;
}
.progress-label { font-size: 0.85rem; color: var(--navy-deep); font-weight: 600; white-space: nowrap; }

.q-number-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--orange);
  color: #fff;
  font-weight: 700;
  margin-bottom: 14px;
}
.q-prompt {
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 22px;
  line-height: 1.5;
}
.q-prompt .jp { font-family: var(--font-jp); font-size: 1.3rem; color: var(--navy-deep); }

.option-list { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  border: 1.5px solid #d8cdbf;
  border-radius: 12px;
  padding: 13px 16px;
  background: #fff;
  cursor: pointer;
  font-family: var(--font-jp);
  font-size: 1rem;
  color: var(--ink);
}
.option:hover { border-color: var(--orange-soft); background: #fffaf4; }
.option .opt-letter {
  flex-shrink: 0;
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1.5px solid #cbbba6;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; color: var(--terracotta);
  font-family: var(--font-ui);
}
.option.selected { border-color: var(--orange); background: var(--peach); }
.option.selected .opt-letter { background: var(--orange); border-color: var(--orange); color: #fff; }
.option:disabled { cursor: default; }
.option.correct { border-color: var(--good); background: #f0faf3; }
.option.correct .opt-letter { background: var(--good); border-color: var(--good); color: #fff; }
.option.wrong { border-color: var(--bad); background: #fdf1ef; }
.option.wrong .opt-letter { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt-mark { margin-left: auto; font-weight: 700; }
.option.correct .opt-mark { color: var(--good); }
.option.wrong .opt-mark { color: var(--bad); }
.answer-feedback { margin-top: 14px; padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 0.92rem; }
.answer-feedback--ok { background: #f0faf3; color: var(--good); }
.answer-feedback--bad { background: #fdf1ef; color: var(--bad); }
.answer-feedback b { text-decoration: underline; }

.quiz-nav { display: flex; justify-content: space-between; margin-top: 26px; }

/* ---------- Kết quả ---------- */
.score-hero { text-align: center; padding: 10px 0 20px; }
.score-num { font-family: var(--font-head); font-size: 3.2rem; font-weight: 700; color: var(--orange); }
.score-sub { color: var(--navy-deep); font-weight: 600; }

.review-item {
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 10px;
  border: 1.5px solid #e6ddd0;
}
.review-item.correct { border-color: #bfe2c9; background: #f3fbf5; }
.review-item.wrong { border-color: #f0c4b7; background: #fdf4f1; }
.review-item .r-prompt { font-weight: 600; margin-bottom: 4px; }
.review-item .r-line { font-size: 0.88rem; }
.review-item .r-line.your { color: var(--bad); }
.review-item .r-line.correct-ans { color: var(--good); }

.hidden { display: none !important; }

footer.app-footer {
  text-align: center;
  font-size: 0.78rem;
  color: #a99a86;
  margin-top: 40px;
}

/* ============================================================
   FLASHCARD KANJI N4 — dán vào cuối khối style, ngay trước dấu đóng của thẻ style
   Màu đo trực tiếp từ pixel ảnh mẫu:
   viền xanh #92BBEC · nền kem #FDFBF6 · viền hồng #F6BAC1
   nền hồng #FEF7F3 · vệt cọ #FCE7E8 · chữ navy #012157
   Kích thước tính theo bề rộng thẻ (cqw) nên thu phóng đúng tỉ lệ.
   Cần trình duyệt hỗ trợ container query (Chrome/Edge 105+, Safari 16+, Firefox 110+).
   ============================================================ */
.fc-panel { padding: 22px 18px 26px; }

.fc-wrap { container-type: inline-size; width: 100%; }
.fc-stage { perspective: 1800px; }

.fc-card {
  position: relative;
  width: 100%;
  aspect-ratio: 1196 / 380;
  border-radius: 2.6cqw;
  transform-style: preserve-3d;
  transition: transform .6s cubic-bezier(.4, .15, .2, 1);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.fc-card.is-flipped { transform: rotateY(180deg); }
.fc-card.fc-noanim { transition: none; }
.fc-card:focus-visible { outline: 3px solid var(--orange, #dd6f0c); outline-offset: 5px; }

.fc-face {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  overflow: hidden;
  border-radius: 2.6cqw;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  color: #012157;
}

/* ---------- MẶT TRƯỚC · khung hồng ---------- */
.fc-face--pink {
  background: #FEF7F3;
  border: .6cqw solid #F6BAC1;
  box-shadow: 0 .5cqw 1.8cqw rgba(226, 130, 145, .14), inset 0 0 0 .18cqw rgba(255, 255, 255, .55);
}
/* ---------- MẶT SAU · khung xanh dương ---------- */
.fc-face--blue {
  background: #FDFBF6;
  border: .6cqw solid #92BBEC;
  box-shadow: 0 .5cqw 1.8cqw rgba(90, 140, 210, .14), inset 0 0 0 .18cqw rgba(255, 255, 255, .55);
  transform: rotateY(180deg);
}

.fc-d { position: absolute; display: block; overflow: visible; pointer-events: none; }

/* ----- mặt hồng: tiêu đề "色 SẮC" + vệt cọ + tia ----- */
.fc-title {
  position: absolute;
  left: 50%;
  top: 24.7%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  gap: .3em;
  padding: .17em .46em;
  font-size: 7.7cqw;
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
}
.fc-title .fc-k { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-weight: 900; }
.fc-title .fc-hv {
  font-family: "Inter", "Noto Sans", "Segoe UI", Arial, sans-serif;
  letter-spacing: .01em;
}
.fc-title .fc-k, .fc-title .fc-hv { position: relative; z-index: 1; }
.fc-brush { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.fc-rays { position: absolute; top: 50%; width: .47em; height: .92em; transform: translateY(-50%); overflow: visible; }
.fc-rays--l { right: calc(100% + .26em); }
.fc-rays--r { left: calc(100% + .26em); }

/* ----- mặt hồng: khung âm đọc nét đứt ----- */
.fc-read {
  position: absolute;
  left: 50%;
  top: 47.3%;
  transform: translateX(-50%);
  box-sizing: border-box;
  width: max-content;
  min-width: 70%;
  max-width: 80%;
  min-height: 29%;
  padding: 1.1cqw 3.4cqw;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  column-gap: .8em;
  row-gap: .02em;
  font-size: calc(var(--r, 4.9) * 1cqw);
  line-height: 1.3;
  border-radius: 3.6cqw;
  background: rgba(255, 255, 255, .42);
  white-space: nowrap;
}
.fc-read--stack { flex-direction: column; flex-wrap: nowrap; row-gap: .12em; max-width: 78%; padding-top: 1.6cqw; padding-bottom: 1.6cqw; }
.fc-dash { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.fc-dash rect {
  fill: none;
  stroke: #FDB4BB;
  stroke-width: .34cqw;
  stroke-dasharray: 1.55cqw 1.5cqw;
  stroke-linecap: round;
  rx: 3.6cqw;
}
.fc-r { position: relative; display: inline-flex; align-items: baseline; gap: .38em; }
.fc-lab { font-family: "Inter", "Noto Sans", "Segoe UI", Arial, sans-serif; font-weight: 600; }
.fc-kana { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-weight: 500; }

/* ----- mặt xanh: các từ ghép ngăn cách bằng dấu / nghiêng ----- */
.fc-words {
  position: absolute;
  left: 10.5%;
  right: 10.5%;
  top: 10%;
  bottom: 28%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  font-weight: 900;
  font-size: calc(var(--k, 7) * 1cqw);
  line-height: 1.22;
  text-align: center;
}
.fc-words--multi { left: 14%; right: 14%; }
.fc-words-in { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; row-gap: .12em; }
.fc-w { display: inline-flex; align-items: center; white-space: nowrap; }
.fc-w:not(:last-child)::after {
  content: "";
  display: inline-block;
  width: .062em;
  height: .84em;
  margin: 0 .4em 0 .44em;
  background: #4573A8;
  border-radius: .05em;
  transform: rotate(21deg);
}

/* ----- điều khiển bên dưới thẻ (dùng ngôn ngữ thiết kế sẵn có của trang) ----- */
.fc-hint { text-align: center; font-size: .82rem; color: var(--terracotta, #bd6f4f); margin: 16px 0 4px; }
.fc-tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
.fc-tools .btn { padding: 9px 18px; font-size: .85rem; }
.fc-tools .btn[aria-pressed="true"] { background: var(--peach, #fbe7d3); border-color: var(--orange, #dd6f0c); }
.fc-chip-row { margin-top: 6px; font-size: .74rem; color: var(--terracotta, #bd6f4f); }

/* ----- điện thoại: thẻ cao hơn để chữ đủ lớn, giữ nguyên bố cục/màu/trang trí ----- */
@container (max-width: 540px) {
  .fc-card { aspect-ratio: 2 / 1; }
  .fc-title { font-size: 9.4cqw; top: 22.5%; }
  .fc-words--multi { left: 13%; right: 13%; }
  .fc-words { font-size: calc(var(--k, 7) * 1.3cqw); left: 12%; right: 12%; top: 11%; bottom: 27%; }
  .fc-read { font-size: calc(var(--r, 4.9) * 1.1cqw); top: 45%; min-width: 72%; max-width: 82%; min-height: 0; flex-direction: column; flex-wrap: nowrap; row-gap: .1em; padding: 2.2cqw 3cqw; }
}
@media (max-width: 600px) { .fc-kbd { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .fc-card { transition: none; }
}

/* ============================================================
   FLASHCARD SHINKANZEN TV N3 — cùng bộ màu / trang trí / phông chữ với Flashcard Kanji
   Mặt trước (hồng): từ vựng · Mặt sau (xanh): Cách đọc – Nghĩa – Ví dụ
   ============================================================ */
.fc-card.fc-card--sv { aspect-ratio: 1196 / 470; }
.fc-face .fc-title.fc-title--word { top: 50%; font-size: calc(var(--w, 11) * 1cqw); }
.fc-title--word .fc-k { line-height: 1.2; }

.fc-sv-back {
  position: absolute;
  left: 13%;
  right: 16%;
  top: 8.5%;
  bottom: 12%;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.6cqw 3.2cqw;
  border-radius: 3.6cqw;
  background: rgba(255, 255, 255, .5);
  font-size: calc(var(--s, 3.9) * 1cqw);
  line-height: 1.34;
  color: #012157;
  overflow: hidden;
}
.fc-sv-back .fc-dash rect { stroke: #9EC3F0; }
.fc-sv-in {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  row-gap: .3em;
}
.fc-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: .5em;
}
.fc-sv-in .fc-lab { flex: 0 0 auto; font-weight: 700; white-space: nowrap; }
.fc-sv-val { flex: 1 1 auto; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.fc-sv-vi { font-family: "Inter", "Noto Sans", "Segoe UI", Arial, sans-serif; font-weight: 600; }
.fc-sv-jp { display: block; font-weight: 700; }
.fc-sv-tr { display: block; font-family: "Inter", "Noto Sans", "Segoe UI", Arial, sans-serif; font-weight: 500; font-size: .9em; margin-top: .06em; }

@container (max-width: 540px) {
  .fc-card.fc-card--sv { aspect-ratio: 3 / 2; }
  .fc-face .fc-title.fc-title--word { top: 50%; font-size: calc(var(--w, 11) * 1.2cqw); }
  .fc-sv-back { left: 11.5%; right: 13.5%; top: 9%; bottom: 13%; padding: 2.2cqw 3.4cqw; border-radius: 4.4cqw; }
}

</style>

let sessionUnsub = null;

function genSessionId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function startSessionWatcher(uid, mySessionId) {
  stopSessionWatcher();
  sessionUnsub = db.collection(USERS_COLLECTION).doc(uid).onSnapshot(doc => {
    const data = doc.data();
    if (data && data.activeSessionId && data.activeSessionId !== mySessionId) {
      forceLogout('Tài khoản này vừa được đăng nhập ở một thiết bị khác.');
    }
  });
}
function stopSessionWatcher() {
  if (sessionUnsub) { sessionUnsub(); sessionUnsub = null; }
}

function forceLogout(message) {
  stopSessionWatcher();
  localStorage.removeItem('n3_session_id');
  auth.signOut();
  go('login', { loginNotice: message || '' });
}

async function doLogin() {
  const email = document.getElementById('in-user').value.trim();
  const pass = document.getElementById('in-pass').value;
  const err = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Vui lòng nhập đầy đủ email và mật khẩu.'; return; }
  btn.disabled = true;
  btn.textContent = 'Đang đăng nhập...';
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    const mySessionId = genSessionId();
    localStorage.setItem('n3_session_id', mySessionId);
    await db.collection(USERS_COLLECTION).doc(uid).set({
      email: email,
      activeSessionId: mySessionId,
      lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
    startSessionWatcher(uid, mySessionId);
    go('section-select');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
    err.textContent = mapFirebaseError(e.code);
  }
}

function mapFirebaseError(code) {
  const map = {
    'auth/invalid-email': 'Email không hợp lệ.',
    'auth/user-not-found': 'Tài khoản không tồn tại.',
    'auth/wrong-password': 'Sai mật khẩu.',
    'auth/invalid-credential': 'Sai email hoặc mật khẩu.',
    'auth/too-many-requests': 'Bạn thử sai quá nhiều lần, vui lòng thử lại sau.',
  };
  return map[code] || ('Đăng nhập thất bại (' + code + ')');
}

function renderQuiz() {
  const { questions, index, answers } = state.quiz;
  const q = questions[index];
  const total = questions.length;
  const selected = answers[q.q_num];
  const answered = selected !== undefined;

  const optionsHtml = q.options.map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    const isSel = selected === opt;
    const jpClass = (q.type === 'B' || q.type === 'C') ? 'jp' : '';
    let cls = isSel ? 'selected' : '';
    if (answered) cls = opt === q.answer ? 'correct' : (isSel ? 'wrong' : '');
    const mark = answered && opt === q.answer ? '<span class="opt-mark">✓</span>' : (answered && isSel ? '<span class="opt-mark">✗</span>' : '');
    return `
      <button class="option ${cls}" data-opt="${escapeAttr(opt)}" ${answered ? 'disabled' : ''}>
        <span class="opt-letter">${letter}</span>
        <span class="${jpClass}">${escapeHtml(opt)}</span>
        ${mark}
      </button>`;
  }).join('');

  const isLast = index === total - 1;
  const feedback = !answered ? '' : (selected === q.answer
    ? `<div class="answer-feedback answer-feedback--ok">✓ Chính xác!</div>`
    : `<div class="answer-feedback answer-feedback--bad">✗ Chưa đúng. Đáp án đúng: <b>${escapeHtml(q.answer)}</b></div>`);

  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${(index / total) * 100}%"></div></div>
        <div class="progress-label">Câu ${index + 1}/${total}</div>
      </div>
      <div class="q-number-badge">${q.q_num}</div>
      <div class="q-prompt">${formatPrompt(q)}</div>
      <div class="option-list">${optionsHtml}</div>
      ${feedback}
      <div class="quiz-nav">
        <button class="btn btn-ghost" id="btn-prev" ${index === 0 ? 'disabled' : ''}>← Câu trước</button>
        <button class="btn btn-primary" id="btn-next" ${answered ? '' : 'disabled'}>
          ${isLast ? 'Nộp bài' : 'Câu tiếp →'}
        </button>
      </div>
    </div>
  `;

  root.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', () => {
      if (state.quiz.answers[q.q_num] !== undefined) return;
      state.quiz.answers[q.q_num] = el.dataset.opt;
      renderQuiz();
    });
  });
  document.getElementById('btn-prev').addEventListener('click', () => {
    state.quiz.index = Math.max(0, index - 1);
    renderQuiz();
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (isLast) {
      submitQuiz();
    } else {
      state.quiz.index = index + 1;
      renderQuiz();
    }
  });
}

function formatPrompt(q) {
  return escapeHtml(q.prompt)
    .replace(/「(.+?)」/g, '「<span class="jp">$1</span>」')
    .replace(/＿＿＿/g, '<span class="jp" style="border-bottom:2px dashed var(--terracotta); padding:0 6px;">＿＿＿</span>');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return s.replace(/"/g, '&quot;'); }

function submitQuiz() {
  const { questions, answers, unitNo, deNo } = state.quiz;
  let correct = 0;
  const detail = questions.map(q => {
    const your = answers[q.q_num];
    const ok = your === q.answer;
    if (ok) correct++;
    return Object.assign({}, q, { your, ok });
  });
  saveAttemptToFirestore(unitNo, deNo, correct, questions.length);
  go('result', { lastResult: { correct, total: questions.length, detail, unitNo, deNo } });
}

function saveAttemptToFirestore(unitNo, deNo, correct, total) {
  const user = auth.currentUser;
  if (!user) return; // khong chan luong lam bai neu vi ly do nao do chua co user
  db.collection(USERS_COLLECTION).doc(user.uid).collection('attempts').add({
    unit: unitNo,
    de: deNo,
    score: correct,
    total: total,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  }).catch(err => console.error('Khong luu duoc lich su lam bai:', err));
}

function renderResult() {
  const { correct, total, detail, unitNo, deNo } = state.lastResult;

  root.innerHTML = `

      <div class="pill-header">Xem lại đáp án</div>
      ${items}

  document.getElementById('btn-home').addEventListener('click', () => go('dashboard'));
}

  });
  document.getElementById('btn-prev').addEventListener('click', () => {
    state.kquiz.index = Math.max(0, index - 1);
    renderKanjiQuiz();
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (isLast) { submitKanjiQuiz(); } else { state.kquiz.index = index + 1; renderKanjiQuiz(); }
  });
}

function submitKanjiQuiz() {
  const { questions, answers, testId } = state.kquiz;
  let correct = 0;
  const detail = questions.map(q => {
    const your = answers[q.q_num];
    const ok = your === q.answer;
    if (ok) correct++;
    return Object.assign({}, q, { your, ok });
  });
  saveKanjiAttemptToFirestore(testId, correct, questions.length);
  go('kanji-result', { lastKanjiResult: { correct, total: questions.length, detail, testId } });
}

function saveKanjiAttemptToFirestore(testId, correct, total) {
  const user = auth.currentUser;
  if (!user) return;
  db.collection(USERS_COLLECTION).doc(user.uid).collection('kanji_attempts').add({
    test: testId, score: correct, total: total,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  }).catch(err => console.error('Khong luu duoc lich su lam bai Kanji:', err));
}

function renderKanjiResult() {
  const { correct, total, detail, testId } = state.lastKanjiResult;
  const pct = Math.round((correct / total) * 100);
  const items = detail.map(d => `
    <div class="review-item ${d.ok ? 'correct' : 'wrong'}">
      <div class="r-prompt">Câu ${d.q_num}: ${formatPrompt(d)}${d.type === 'C' && d.nghia ? ` <span style="color:var(--terracotta); font-weight:400;">(${escapeHtml(d.nghia)})</span>` : ''}</div>
      ${d.ok
        ? `<div class="r-line correct-ans">✓ Bạn chọn đúng: ${escapeHtml(d.answer)}</div>`
        : `<div class="r-line your">✗ Bạn chọn: ${escapeHtml(d.your || '(bỏ trống)')}</div>
           <div class="r-line correct-ans">✓ Đáp án đúng: ${escapeHtml(d.answer)}</div>`}
    </div>
  `).join('');

  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="score-hero">
        <div class="score-num">${correct}/${total}</div>
        <div class="score-sub">${pct}% chính xác — Kanji N4 · Đề ${testId}</div>
      </div>
      <div style="display:flex; gap:12px; justify-content:center; margin-bottom:26px;">
        <button class="btn btn-primary" id="btn-retry">Làm lại đề này</button>
        <button class="btn btn-ghost" id="btn-home">Về danh sách đề</button>
      </div>
      <div class="pill-header">Xem lại đáp án</div>
      ${items}
    </div>
  `;
  document.getElementById('btn-retry').addEventListener('click', () => startKanjiTest(testId));
  document.getElementById('btn-home').addEventListener('click', () => go('kanji-dashboard'));
}

function fcSakura(cx, cy, r, rot) {
  const petal = 'M0 0 C-.44 -.12 -.54 -.66 -.27 -.94 C-.19 -1.02 -.08 -.97 0 -.85 C.08 -.97 .19 -1.02 .27 -.94 C.54 -.66 .44 -.12 0 0Z';
  let g = `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${r})">`;
  for (let i = 0; i < 5; i++) {
    g += `<g transform="rotate(${i * 72})">
      <path d="${petal}" fill="#FBA3A8"/>
      <path d="${petal}" transform="scale(.7)" fill="#FDBABD" opacity=".55"/>
      <path d="M0 -.12 L0 -.6" stroke="#F3858E" stroke-width=".03" stroke-linecap="round" opacity=".5"/>
    </g>`;
  }
  for (let i = 0; i < 5; i++) {
    const a = (36 + i * 72) * Math.PI / 180, x = Math.sin(a) * .3, y = -Math.cos(a) * .3;
    g += `<line x1="0" y1="0" x2="${x.toFixed(3)}" y2="${y.toFixed(3)}" stroke="#FFF3EA" stroke-width=".055" stroke-linecap="round"/>
          <circle cx="${x.toFixed(3)}" cy="${y.toFixed(3)}" r=".05" fill="#FFF3EA"/>`;
  }
  return g + '<circle r=".09" fill="#FFF6EF"/></g>';
}
function fcLoosePetal(cx, cy, rx, ry, rot, fill) {
  return `<path transform="translate(${cx} ${cy}) rotate(${rot}) scale(${rx} ${ry})" d="M0 -1 C.62 -.9 .7 .55 0 1 C-.7 .55 -.62 -.9 0 -1Z" fill="${fill || '#FBB0B4'}"/>`;
}

/* ---------- Mặt thẻ ---------- */
function fcWordScale(words) {
  const n = words.reduce((s, w) => s + [...w].length, 0);
  if (n <= 9) return 7.0;
  if (n <= 11) return 6.4;
  if (n <= 13) return 5.6;
  if (n <= 15) return 5.1;
  return 4.6;
}
function fcReadInfo(kun, on) {
  // Ước lượng bề rộng theo "em": nhãn Latin ~3.5em, kana 1em, dấu ngoặc 0.4em
  const len = (t) => [...t].reduce((a, ch) => a + (ch === '(' || ch === ')' ? .4 : 1), 0);
  const kRow = kun ? 3.7 + len(kun) : 0, oRow = on ? 3.3 + len(on) : 0;
  const one = kRow + oRow + (kun && on ? .8 : 0) + .6;
  if (one <= 15.5) return { r: Math.max(3.6, Math.min(4.9, 66 / one)).toFixed(2), stack: false };
  return { r: Math.max(3.2, Math.min(4.3, 62 / (Math.max(kRow, oRow) + .6))).toFixed(2), stack: true };
}
function fcFrontHtml(c) {
  const hv = escapeHtml(c.hanviet.toLocaleUpperCase('vi'));
  const parts = [];
  if (c.kun) parts.push(`<span class="fc-r"><span class="fc-lab">âm Kun:</span><span class="fc-kana">${escapeHtml(c.kun)}</span></span>`);
  if (c.on) parts.push(`<span class="fc-r"><span class="fc-lab">âm on:</span><span class="fc-kana">${escapeHtml(c.on)}</span></span>`);
  const ri = fcReadInfo(c.kun, c.on);
  return `
    <div class="fc-face fc-face--pink">
      ${FC_DECOR_PINK}
      <div class="fc-title">${FC_BRUSH}${FC_RAYS_L}${FC_RAYS_R}
        <span class="fc-k">${escapeHtml(c.kanji)}</span><span class="fc-hv">${hv}</span></div>
      <div class="fc-read${ri.stack ? ' fc-read--stack' : ''}" style="--r:${ri.r}">
        <svg class="fc-dash" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="26"/></svg>
        ${parts.join('')}
      </div>
    </div>`;
}
function fcBackHtml(c) {
  const words = c.words.map(w => `<span class="fc-w">${escapeHtml(w)}</span>`).join('');
  return `
    <div class="fc-face fc-face--blue">
      ${FC_DECOR_BLUE}
      <div class="fc-words${c.words.join('').length > 9 ? ' fc-words--multi' : ''}" style="--k:${fcWordScale(c.words)}"><div class="fc-words-in">${words}</div></div>
    </div>`;
}

/* ---------- Shinkanzen TV N3: mặt trước = từ vựng · mặt sau = cách đọc / nghĩa / ví dụ ---------- */
function fcShinScale(w) {
  const n = [...w].length;
  if (n <= 2) return 13;
  if (n <= 4) return 11.5;
  if (n <= 6) return 9.5;
  if (n <= 8) return 8;
  if (n <= 11) return 6.6;
  return 5.6;
}
function fcFrontShin(c) {
  return `
    <div class="fc-face fc-face--pink">
      ${FC_DECOR_PINK}
      <div class="fc-title fc-title--word" style="--w:${fcShinScale(c.word)}">${FC_BRUSH}${FC_RAYS_L}${FC_RAYS_R}
        <span class="fc-k">${escapeHtml(c.word)}</span></div>
    </div>`;
}
function fcBackShin(c) {
  return `
    <div class="fc-face fc-face--blue">
      ${FC_DECOR_BLUE}
      <div class="fc-sv-back">
        <svg class="fc-dash" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="26"/></svg>
        <div class="fc-sv-in">
          <div class="fc-row"><span class="fc-lab">Cách đọc:</span><span class="fc-sv-val fc-kana">${escapeHtml(c.reading)}</span></div>
          <div class="fc-row"><span class="fc-lab">Nghĩa:</span><span class="fc-sv-val fc-sv-vi">${escapeHtml(c.meaning)}</span></div>
          <div class="fc-row"><span class="fc-lab">Ví dụ:</span><span class="fc-sv-val"><span class="fc-kana fc-sv-jp">${escapeHtml(c.example)}</span><span class="fc-sv-tr">( ${escapeHtml(c.trans)} )</span></span></div>
        </div>
      </div>
    </div>`;
}
/* Tự thu nhỏ chữ cho vừa khung (mọi câu dài đều nằm trọn trong thẻ) */
function fcFitShin(card) {
  const face = card.querySelector('.fc-face--pink'), t = card.querySelector('.fc-title--word');
  if (face && t) {
    let w = parseFloat(t.style.getPropertyValue('--w')) || 11, guard = 40;
    const over = () => t.offsetWidth + parseFloat(getComputedStyle(t).fontSize) * 1.55 > face.clientWidth * 0.93;
    while (over() && w > 2.5 && guard--) { w -= 0.35; t.style.setProperty('--w', w.toFixed(2)); }
  }
  const box = card.querySelector('.fc-sv-back'), inn = card.querySelector('.fc-sv-in');
  if (box && inn) {
    const cs = getComputedStyle(box);
    const avail = () => box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let s = card.clientWidth <= 540 ? 5.5 : 3.9, guard = 80;
    box.style.setProperty('--s', s);
    while (inn.offsetHeight > avail() && s > 1.6 && guard--) { s -= 0.1; box.style.setProperty('--s', s.toFixed(2)); }
  }
}

/* ---------- Chọn chương ---------- */
function fcChapterList(setId) {
  const S = FC_SETS[setId || state.fcSet] || FC_SETS.n4;

  S.cards().forEach((c, i) => {

    map.get(c[S.key]).push(i);

  return [...map.entries()].sort((a, b) => a[0] - b[0]);
}

/* ---------- Học flashcard ---------- */
function fcShuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function startFlash(chapter) {
  const deck = [];
  const S = fcSet();
  S.cards().forEach((c, i) => { if (chapter === 'all' || String(c[S.key]) === String(chapter)) deck.push(i); });
  go('flash-study', { fc: { chapter, deck, i: 0, startBack: false, shuffled: false } });
}

function fcFlip() {
  const card = document.getElementById('fc-card');
  if (card) card.classList.toggle('is-flipped');
}
function fcMove(step) {
  const f = state.fc; if (!f) return;
  const n = f.deck.length;
  f.i = Math.min(n - 1, Math.max(0, f.i + step));
  fcUpdate(true);
}
function fcUpdate(resetFlip) {
  const f = state.fc, card = document.getElementById('fc-card');
  if (!f || !card) return;
  const S = fcSet(), c = S.cards()[f.deck[f.i]];
  card.classList.toggle('fc-card--sv', !!S.sv);
  if (resetFlip) {
    card.classList.add('fc-noanim');
    card.classList.toggle('is-flipped', f.startBack);
  }
  card.innerHTML = (S.front || fcFrontHtml)(c) + (S.back || fcBackHtml)(c);
  if (S.fit) S.fit(card);
  if (resetFlip) { void card.offsetWidth; card.classList.remove('fc-noanim'); }
  const total = f.deck.length;
  document.getElementById('fc-bar').style.width = ((f.i + 1) / total * 100) + '%';
  document.getElementById('fc-count').textContent =
    (f.chapter === 'all' ? 'Tất cả' : fcSet().unit + ' ' + f.chapter) + ' · ' + (f.i + 1) + '/' + total;
  document.getElementById('fc-prev').disabled = f.i === 0;
  document.getElementById('fc-next').disabled = f.i === total - 1;
  card.setAttribute('aria-label', S.aria ? S.aria(c) : 'Thẻ ' + c.kanji + ', ' + c.hanviet + '. Nhấn để lật thẻ');
  const shuf = document.getElementById('fc-shuffle'), swap = document.getElementById('fc-swap');
  shuf.setAttribute('aria-pressed', String(f.shuffled)); shuf.textContent = f.shuffled ? 'Đúng thứ tự' : 'Xáo trộn';
  swap.setAttribute('aria-pressed', String(f.startBack)); swap.textContent = f.startBack ? 'Hiện mặt hồng trước' : 'Hiện mặt xanh trước';
}
let fcKeysBound = false;
function fcRefit() {
  if (state.screen !== 'flash-study') return;
  const S = fcSet(), card = document.getElementById('fc-card');
  if (S.fit && card) S.fit(card);
}
function fcBindKeys() {
  if (fcKeysBound) return;
  fcKeysBound = true;
  window.addEventListener('resize', fcRefit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fcRefit);
  document.addEventListener('keydown', (e) => {
    if (state.screen !== 'flash-study') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); fcMove(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); fcMove(-1); }
    else if ((e.key === ' ' || e.key === 'Enter') && document.activeElement && document.activeElement.id === 'fc-card') { e.preventDefault(); fcFlip(); }
    else if (e.key === ' ' && !/^(BUTTON|INPUT|A)$/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); fcFlip(); }
  });
}

/* ============================================================
   LUYỆN TẬP (quiz trắc nghiệm) — sinh câu hỏi trực tiếp từ dữ
   liệu Flashcard (KANJI_CARDS / KANJI_N3_CARDS / SHIN_CARDS) để
   đảm bảo mọi câu hỏi và đáp án đều chính xác 100% theo dữ liệu
   đã có, không tự soạn thêm kiến thức nào khác.
   ============================================================ */
function fcPickDistractors(values, correct, n, extra) {
  let cand = fcShuffle([...new Set(values)].filter(v => v && v !== correct));
  if (cand.length < n && extra) {
    const more = fcShuffle([...new Set(extra)].filter(v => v && v !== correct && !cand.includes(v)));
    cand = cand.concat(more);
  }
  return cand.slice(0, n);
}

/* Chọn nhiễu (distractor) theo một "khoá loại trừ" riêng — để tránh
   trường hợp một lựa chọn sai lại vô tình cũng là một đáp án đúng
   khác (ví dụ 2 từ khác nhau nhưng đọc giống nhau — từ đồng âm —
   hoặc 2 từ khác nhau nhưng cùng một nghĩa). Luôn đảm bảo 4 lựa chọn
   chỉ có DUY NHẤT 1 đáp án đúng. */
function fcPickDistractorsKeyed(items, correctItem, valueKey, excludeKey, n, extraItems) {
  return fcPickDistractorsBy(items, it => it[excludeKey] === correctItem[excludeKey], it => it[valueKey], n, extraItems);
}

function fcPickDistractorsBy(items, excludeFn, valueFn, n, extraItems) {
  const seen = new Set();
  const out = [];
  for (const it of fcShuffle(items)) {
    if (excludeFn(it)) continue;
    const v = valueFn(it);
    if (v && !seen.has(v)) { seen.add(v); out.push(v); if (out.length === n) break; }
  }
  if (out.length < n && extraItems) {
    for (const it of fcShuffle(extraItems)) {
      if (out.length === n) break;
      if (excludeFn(it)) continue;
      const v = valueFn(it);
      if (v && !seen.has(v)) { seen.add(v); out.push(v); }
    }
  }
  return out;
}

function fcReadingPairs(setId, cards) {
  if (setId === 'shin') return cards.map(c => ({ surface: c.word, reading: c.reading }));
  const pairs = [];
  cards.forEach(c => (c.words || []).forEach((w, i) => {
    const r = c.readings && c.readings[i];
    if (w && r && !w.startsWith('〜')) pairs.push({ surface: w, reading: r });
  }));
  return pairs;
}

/* 2 dạng luyện tập giống hệt phần "Luyện Kanji N4" gốc:
   K2H = cho chữ/từ, chọn đúng cách đọc (hiragana) ;
   H2K = cho cách đọc, chọn đúng chữ/từ viết bằng Kanji. */
function fcFlashPracticeQuestions(setId, idxs) {
  const S = FC_SETS[setId];
  const CARDS = S.cards();
  const allPairs = fcReadingPairs(setId, CARDS);
  const deckPairs = fcReadingPairs(setId, idxs.map(i => CARDS[i]));
  const qs = [];
  deckPairs.forEach(p => {
    if (Math.random() < 0.5) {
      // K2H: nhiễu là các cách đọc khác — loại theo "reading" nên không thể trùng đáp án đúng.
      const distractors = fcPickDistractorsKeyed(deckPairs, p, 'reading', 'reading', 3, allPairs);
      if (distractors.length < 3) return;
      qs.push({ type: 'K2H', prompt: `「${p.surface}」 đọc là gì?`, options: fcShuffle([p.reading, ...distractors]), answer: p.reading });
    } else {
      // H2K: nhiễu phải là từ có CÁCH ĐỌC khác — tránh chọn nhầm 1 từ đồng âm (đọc giống) làm phương án sai.
      const distractors = fcPickDistractorsKeyed(deckPairs, p, 'surface', 'reading', 3, allPairs);
      if (distractors.length < 3) return;
      qs.push({ type: 'H2K', prompt: `「${p.reading}」 viết Kanji thế nào?`, options: fcShuffle([p.surface, ...distractors]), answer: p.surface });
    }
  });
  return qs;
}

/* Luyện tập cho bộ TỪ VỰNG Shinkanzen TV N3: 2 dạng như phần
   "Luyện tập từ vựng N3" gốc — cho từ tiếng Nhật chọn nghĩa tiếng
   Việt (và ngược lại), và cho 1 câu có chỗ trống chọn từ phù hợp. */
/* Ngữ cảnh ngay sau chỗ trống của 1 từ, dùng để tránh chọn nhiễu mà
   khi điền vào CÙNG một chỗ trống đó vẫn tạo thành câu đúng ngữ pháp
   (ví dụ: nhiều tính từ chỉ tính cách đều có ví dụ dạng "＿＿＿人" —
   nhiễu là tính từ khác cũng hợp lệ về ngữ pháp dù nghĩa khác nhau). */
function fcBlankContext(c) {
  if (!c.example || !c.example.includes(c.word)) return null;
  const idx = c.example.indexOf(c.word);
  const full = c.example.replace(c.word, '\u0000');
  const after = c.example.slice(idx + c.word.length, idx + c.word.length + 2);
  return { full, after };
}

function fcShinQuestions(idxs) {
  const CARDS = SHIN_CARDS;
  const deck = idxs.map(i => CARDS[i]);
  const qs = [];
  deck.forEach(c => {
    const canC = c.example && c.example.includes(c.word);
    const order = fcShuffle(canC ? ['A', 'B', 'C'] : ['A', 'B']);
    for (const type of order) {
      if (type === 'A') {
        // Nhiễu loại theo "meaning" (chính là giá trị hiển thị) — không thể trùng nghĩa đúng.
        const distractors = fcPickDistractorsBy(deck, it => it.meaning === c.meaning, it => it.meaning, 3, CARDS);
        if (distractors.length < 3) continue;
        qs.push({ type: 'A', prompt: `「${c.word}」 nghĩa là gì?`, options: fcShuffle([c.meaning, ...distractors]), answer: c.meaning });
        break;
      } else if (type === 'B') {
        // Nhiễu phải khác NGHĨA và khác luôn CHỮ — 1 từ có 2 mục nghĩa khác nhau (đa nghĩa)
        // vẫn phải bị loại để không lặp lại chính từ đúng dưới một nghĩa khác.
        const distractors = fcPickDistractorsBy(deck, it => it.word === c.word || it.meaning === c.meaning, it => it.word, 3, CARDS);
        if (distractors.length < 3) continue;
        qs.push({ type: 'B', prompt: `Từ nào có nghĩa là "${c.meaning}"?`, options: fcShuffle([c.word, ...distractors]), answer: c.word });
        break;
      } else {
        // Điền vào chỗ trống: loại nhiễu nào mà khi điền vào CÙNG chỗ trống này
        // (cùng câu, hoặc cùng chữ ngay sau chỗ trống) vẫn tạo câu hợp lệ về ngữ pháp.
        const ctx = fcBlankContext(c);
        const conflict = it => {
          const ic = fcBlankContext(it);
          if (ic && ic.full === ctx.full) return true;
          if (ic && ctx.after && ic.after === ctx.after && /[\u4E00-\u9FFF]/.test(ctx.after[0])) return true;
          // Chỗ trống đứng ngay trước "人" (mô tả tính cách): BẤT KỲ tính từ nào
          // (kết thúc い/な/した/いた) cũng điền được về ngữ pháp, nên phải loại
          // hết các từ dạng tính từ khác, không chỉ những từ trùng ví dụ.
          if (ctx.after && ctx.after[0] === '人' && /(い|な|した|いた)$/.test(it.word)) return true;
          return false;
        };
        const distractors = fcPickDistractorsBy(deck, it => it.word === c.word || it.meaning === c.meaning || conflict(it), it => it.word, 3, CARDS);
        if (distractors.length < 3) continue;
        qs.push({ type: 'C', prompt: `Điền từ đúng vào chỗ trống: ${c.example.replace(c.word, '＿＿＿')}`, options: fcShuffle([c.word, ...distractors]), answer: c.word });
        break;
      }
    }
  });
  return qs;
}

function startFlashQuiz(chapter) {
  const setId = state.fcSet;
  const S = FC_SETS[setId];
  const idxs = [];
  S.cards().forEach((c, i) => { if (chapter === 'all' || String(c[S.key]) === String(chapter)) idxs.push(i); });
  let questions = setId === 'shin' ? fcShinQuestions(idxs) : fcFlashPracticeQuestions(setId, idxs);
  questions = fcShuffle(questions).map((q, i) => Object.assign({}, q, { q_num: i + 1 }));
  go('flash-quiz', { fquiz: { setId, chapter, questions, index: 0, answers: {} } });
}

function renderFlashQuiz() {
  const { questions, index, answers } = state.fquiz;
  const total = questions.length;
  if (!total) {
    root.innerHTML = `
      ${brandHeader()}
      <div class="card" style="text-align:center;">
        <p style="color:var(--navy-deep);">Nhóm này chưa có đủ dữ liệu để tạo câu luyện tập (cần ít nhất 4 thẻ khác nhau).</p>
        <button class="btn btn-ghost" id="fc-quiz-back">← Về danh sách</button>
      </div>`;
    document.getElementById('fc-quiz-back').addEventListener('click', () => go('flash-dashboard'));
    return;
  }
  const q = questions[index];
  const selected = answers[q.q_num];
  const answered = selected !== undefined;
  const optionsHtml = q.options.map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    const isSel = selected === opt;
    const jp = /[\u3040-\u30FF\u4E00-\u9FFF]/.test(opt) ? 'jp' : '';
    let cls = isSel ? 'selected' : '';
    if (answered) cls = opt === q.answer ? 'correct' : (isSel ? 'wrong' : '');
    const mark = answered && opt === q.answer ? '<span class="opt-mark">✓</span>' : (answered && isSel ? '<span class="opt-mark">✗</span>' : '');
    return `
      <button class="option ${cls}" data-opt="${escapeAttr(opt)}" ${answered ? 'disabled' : ''}>
        <span class="opt-letter">${letter}</span>
        <span class="${jp}">${escapeHtml(opt)}</span>
        ${mark}
      </button>`;
  }).join('');
  const isLast = index === total - 1;
  const feedback = !answered ? '' : (selected === q.answer
    ? `<div class="answer-feedback answer-feedback--ok">✓ Chính xác!</div>`
    : `<div class="answer-feedback answer-feedback--bad">✗ Chưa đúng. Đáp án đúng: <b>${escapeHtml(q.answer)}</b></div>`);
  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${(index / total) * 100}%"></div></div>
        <div class="progress-label">Câu ${index + 1}/${total}</div>
      </div>
      <div class="q-number-badge">${q.q_num}</div>
      <div class="q-prompt">${formatPrompt(q)}</div>
      <div class="option-list">${optionsHtml}</div>
      ${feedback}
      <div class="quiz-nav">
        <button class="btn btn-ghost" id="btn-prev" ${index === 0 ? 'disabled' : ''}>← Câu trước</button>
        <button class="btn btn-primary" id="btn-next" ${answered ? '' : 'disabled'}>
          ${isLast ? 'Nộp bài' : 'Câu tiếp →'}
        </button>
      </div>
    </div>
  `;
  root.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', () => {
      if (state.fquiz.answers[q.q_num] !== undefined) return;
      state.fquiz.answers[q.q_num] = el.dataset.opt; renderFlashQuiz();
    });
  });
  document.getElementById('btn-prev').addEventListener('click', () => { state.fquiz.index = Math.max(0, index - 1); renderFlashQuiz(); });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (isLast) submitFlashQuiz(); else { state.fquiz.index = index + 1; renderFlashQuiz(); }
  });
}

function submitFlashQuiz() {
  const { questions, answers, setId, chapter } = state.fquiz;
  let correct = 0;
  const detail = questions.map(q => {
    const your = answers[q.q_num]; const ok = your === q.answer;
    if (ok) correct++;
    return Object.assign({}, q, { your, ok });
  });
  go('flash-quiz-result', { fquizResult: { correct, total: questions.length, detail, setId, chapter } });
}

function renderFlashQuizResult() {
  const { correct, total, detail, setId, chapter } = state.fquizResult;
  const pct = total ? Math.round((correct / total) * 100) : 0;
  const S = FC_SETS[setId];
  const items = detail.map(d => `
    <div class="review-item ${d.ok ? 'correct' : 'wrong'}">
      <div class="r-prompt">Câu ${d.q_num}: ${formatPrompt(d)}</div>
      ${d.ok
        ? `<div class="r-line correct-ans">✓ Bạn chọn đúng: ${escapeHtml(d.answer)}</div>`
        : `<div class="r-line your">✗ Bạn chọn: ${escapeHtml(d.your || '(bỏ trống)')}</div>
           <div class="r-line correct-ans">✓ Đáp án đúng: ${escapeHtml(d.answer)}</div>`}
    </div>
  `).join('');
  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="score-hero">
        <div class="score-num">${correct}/${total}</div>
        <div class="score-sub">${pct}% chính xác — Luyện tập ${S.name} ${chapter === 'all' ? '· Tất cả' : '· ' + S.unit + ' ' + chapter}</div>
      </div>
      <div style="display:flex; gap:12px; justify-content:center; margin-bottom:26px;">
        <button class="btn btn-primary" id="btn-retry">Làm lại</button>
        <button class="btn btn-ghost" id="btn-home">Về danh sách ${S.unit.toLowerCase()}</button>
      </div>
      <div class="pill-header">Xem lại đáp án</div>
      ${items}
    </div>
  `;
  document.getElementById('btn-retry').addEventListener('click', () => { state.fcSet = setId; startFlashQuiz(chapter); });
  document.getElementById('btn-home').addEventListener('click', () => { state.fcSet = setId; state.fcMode = 'quiz'; go('flash-dashboard'); });
}


function render() {
  if (state.screen === 'login') return renderLogin();
  if (state.screen === 'section-select') return renderSectionSelect();
  if (state.screen === 'dashboard') return renderDashboard();
  if (state.screen === 'unit-detail') return renderUnitDetail();
  if (state.screen === 'quiz') return renderQuiz();
  if (state.screen === 'result') return renderResult();
  if (state.screen === 'kanji-dashboard') return renderKanjiDashboard();
  if (state.screen === 'kanji-quiz') return renderKanjiQuiz();
  if (state.screen === 'kanji-result') return renderKanjiResult();
  if (state.screen === 'flash-dashboard') return renderFlashDashboard();
  if (state.screen === 'flash-study') return renderFlashStudy();
  if (state.screen === 'flash-quiz') return renderFlashQuiz();
  if (state.screen === 'flash-quiz-result') return renderFlashQuizResult();
}

/* Khoi dong: dung Firebase onAuthStateChanged de kiem tra da dang nhap chua.
   Neu co, kiem tra tiep sessionId cua thiet bi nay con khop voi server khong
   (phong truong hop tab bi dong roi mo lai, hoac thiet bi khac da dang nhap
   de trong luc thiet bi nay offline). */
auth.onAuthStateChanged(async (user) => {
  if (!user) { go('login'); return; }
  const mySessionId = localStorage.getItem('n3_session_id');
  if (!mySessionId) { go('login'); return; }
  try {
    const doc = await db.collection(USERS_COLLECTION).doc(user.uid).get();
    const data = doc.data();
    if (data && data.activeSessionId === mySessionId) {
      startSessionWatcher(user.uid, mySessionId);
      go('section-select');
    } else {
      forceLogout('Tài khoản này đã được đăng nhập ở một thiết bị khác.');
    }
  } catch (e) {
    go('login');
  }
});

</script>

<style>
/* ============================================================
   Bảng màu lấy trực tiếp từ bộ slide PowerPoint đã làm (đo pixel
   thật từ ảnh render), không phải màu tự chọn — để giữ đúng
   nhận diện thương hiệu xuyên suốt tài liệu học + web luyện tập.
   ============================================================ */
:root {
  --navy: #1b4a7a;
  --navy-deep: #123152;
  --orange: #dd6f0c;
  --orange-soft: #f2934a;
  --peach: #fbe7d3;
  --peach-deep: #f6d3ab;
  --terracotta: #bd6f4f;
  --cream: #fbf8f4;
  --ink: #2a2018;
  --good: #2f7d4f;
  --bad: #b8462f;
  --font-head: "Zilla Slab", Georgia, serif;
  --font-ui: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-jp: "Noto Sans JP", var(--font-ui);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.app-shell {
  width: 100%;
  max-width: 760px;
  padding: 28px 20px 64px;
  margin: 0 auto;
}

/* ---------- Header / thương hiệu ---------- */
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.brand-icon {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}
.brand-text .brand-title {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 1.35rem;
  color: var(--navy-deep);
  line-height: 1.1;
}
.brand-text .brand-sub {
  font-size: 0.8rem;
  color: var(--terracotta);
  letter-spacing: 0.02em;
}

/* ---------- Thẻ / khung viền (giữ đúng phong cách vở học) ---------- */
.card {
  background: #fff;
  border: 2px solid var(--terracotta);
  border-radius: 22px;
  padding: 28px 26px;
  position: relative;
}
.card + .card { margin-top: 18px; }

.pill-header {
  display: inline-block;
  background: var(--peach);
  border: 2px solid var(--orange-soft);
  border-radius: 999px;
  padding: 6px 20px;
  font-family: var(--font-head);
  font-weight: 600;
  color: var(--navy-deep);
  margin-bottom: 18px;
}

/* ---------- Form đăng nhập ---------- */
.login-card { max-width: 420px; margin: 6vh auto 0; }
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--navy-deep);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #d8cdbf;
  border-radius: 10px;
  font-size: 1rem;
  font-family: var(--font-ui);
}
.field input:focus {
  outline: none;
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(221, 111, 12, 0.15);
}
.hint-box {
  background: var(--peach);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 0.82rem;
  color: var(--navy-deep);
  margin-top: 14px;
  line-height: 1.5;
}
.error-msg {
  color: var(--bad);
  font-size: 0.85rem;
  margin-top: 6px;
  min-height: 1em;
}

/* ---------- Nút bấm ---------- */
.btn {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 0.95rem;
  border: none;
  border-radius: 999px;
  padding: 12px 26px;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { background: #c8620a; }
.btn-primary:disabled {
  background: #e5d9cb;
  color: #a99a86;
  cursor: not-allowed;
}
.btn-ghost {
  background: transparent;
  color: var(--navy);
  border: 1.5px solid var(--navy);
}
.btn-ghost:hover { background: rgba(27, 74, 122, 0.06); }
.btn-block { width: 100%; }

/* ---------- Lưới chọn Unit ---------- */
.unit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}
.unit-tile {
  border: 2px solid var(--terracotta);
  border-radius: 16px;
  padding: 16px 14px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  transition: transform 0.1s ease, box-shadow 0.15s ease;
}
.unit-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.08); }
.unit-tile .u-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--orange);
  color: #fff;
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 8px;
}
.unit-tile .u-name { font-weight: 700; color: var(--navy-deep); font-size: 0.95rem; }
.unit-tile .u-range { font-size: 0.75rem; color: var(--terracotta); margin-top: 2px; }

.unit-tile.locked {
  cursor: not-allowed;
  opacity: 0.55;
  background: repeating-linear-gradient(135deg, #fff, #fff 10px, #faf6f0 10px, #faf6f0 20px);
}
.unit-tile.locked .u-num { background: #cbb9a4; }
.badge-soon {
  display: inline-block;
  font-size: 0.68rem;
  background: var(--peach);
  color: var(--terracotta);
  border-radius: 999px;
  padding: 2px 9px;
  margin-top: 6px;
  font-weight: 600;
}

/* ---------- Chọn đề ---------- */
.de-row { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.de-tile {
  flex: 1;
  min-width: 160px;
  border: 2px solid var(--terracotta);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  background: #fff;
  cursor: pointer;
}
.de-tile:hover { background: var(--peach); }
.de-tile.locked { cursor: not-allowed; opacity: 0.5; }
.de-tile .de-title { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; color: var(--navy-deep); }
.de-tile .de-meta { font-size: 0.8rem; color: var(--terracotta); margin-top: 4px; }

/* ---------- Màn hình làm bài ---------- */
.progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.progress-track {
  flex: 1;
  height: 8px;
  background: var(--peach);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--orange);
  border-radius: 999px;
  transition: width 0.25s ease;
}
.progress-label { font-size: 0.85rem; color: var(--navy-deep); font-weight: 600; white-space: nowrap; }

.q-number-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--orange);
  color: #fff;
  font-weight: 700;
  margin-bottom: 14px;
}
.q-prompt {
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 22px;
  line-height: 1.5;
}
.q-prompt .jp { font-family: var(--font-jp); font-size: 1.3rem; color: var(--navy-deep); }

.option-list { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  border: 1.5px solid #d8cdbf;
  border-radius: 12px;
  padding: 13px 16px;
  background: #fff;
  cursor: pointer;
  font-family: var(--font-jp);
  font-size: 1rem;
  color: var(--ink);
}
.option:hover { border-color: var(--orange-soft); background: #fffaf4; }
.option .opt-letter {
  flex-shrink: 0;
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1.5px solid #cbbba6;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; color: var(--terracotta);
  font-family: var(--font-ui);
}
.option.selected { border-color: var(--orange); background: var(--peach); }
.option.selected .opt-letter { background: var(--orange); border-color: var(--orange); color: #fff; }
.option:disabled { cursor: default; }
.option.correct { border-color: var(--good); background: #f0faf3; }
.option.correct .opt-letter { background: var(--good); border-color: var(--good); color: #fff; }
.option.wrong { border-color: var(--bad); background: #fdf1ef; }
.option.wrong .opt-letter { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt-mark { margin-left: auto; font-weight: 700; }
.option.correct .opt-mark { color: var(--good); }
.option.wrong .opt-mark { color: var(--bad); }
.answer-feedback { margin-top: 14px; padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 0.92rem; }
.answer-feedback--ok { background: #f0faf3; color: var(--good); }
.answer-feedback--bad { background: #fdf1ef; color: var(--bad); }
.answer-feedback b { text-decoration: underline; }

.quiz-nav { display: flex; justify-content: space-between; margin-top: 26px; }

/* ---------- Kết quả ---------- */
.score-hero { text-align: center; padding: 10px 0 20px; }
.score-num { font-family: var(--font-head); font-size: 3.2rem; font-weight: 700; color: var(--orange); }
.score-sub { color: var(--navy-deep); font-weight: 600; }

.review-item {
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 10px;
  border: 1.5px solid #e6ddd0;
}
.review-item.correct { border-color: #bfe2c9; background: #f3fbf5; }
.review-item.wrong { border-color: #f0c4b7; background: #fdf4f1; }
.review-item .r-prompt { font-weight: 600; margin-bottom: 4px; }
.review-item .r-line { font-size: 0.88rem; }
.review-item .r-line.your { color: var(--bad); }
.review-item .r-line.correct-ans { color: var(--good); }

.hidden { display: none !important; }

footer.app-footer {
  text-align: center;
  font-size: 0.78rem;
  color: #a99a86;
  margin-top: 40px;
}

</style>

const auth = firebase.auth();

const USERS_COLLECTION = 'testtiengviet';

let sessionUnsub = null;
function genSessionId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }

function startSessionWatcher(uid, mySessionId) {
  stopSessionWatcher();
  sessionUnsub = db.collection(USERS_COLLECTION).doc(uid).onSnapshot(doc => {
    const data = doc.data();
    if (data && data.activeSessionId && data.activeSessionId !== mySessionId) {
      forceLogout('Tài khoản này vừa được đăng nhập ở một thiết bị khác.');
    }
  });
}
function stopSessionWatcher() { if (sessionUnsub) { sessionUnsub(); sessionUnsub = null; } }
function forceLogout(message) {
  stopSessionWatcher();
  localStorage.removeItem('tv_session_id');
  auth.signOut();
  go('login', { loginNotice: message || '' });
}

let state = { screen: 'login', quiz: null, lastResult: null };
const root = document.getElementById('app-root');
root.innerHTML = '<div class="card" style="text-align:center; color:var(--navy-deep);">Đang tải...</div>';

function go(screen, payload) {
  state.screen = screen;
  if (payload) Object.assign(state, payload);
  render();
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
function formatPrompt(q) {
  return escapeHtml(q.prompt)
    .replace(/「(.+?)」/g, '「<span class="jp">$1</span>」')
    .replace(/"(.+?)"/g, '"<span>$1</span>"');
}

function brandHeader() {
  return `
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 48 48" fill="none">
        <path d="M6 12c6-4 12-4 18 0v24c-6-4-12-4-18 0V12z" fill="#fbe7d3" stroke="#bd6f4f" stroke-width="2"/>
        <path d="M42 12c-6-4-12-4-18 0v24c6-4 12-4 18 0V12z" fill="#fbe7d3" stroke="#bd6f4f" stroke-width="2"/>
      </svg>
      <div class="brand-text">
        <div class="brand-title">kimoanh.tiengviet</div>
      </div>
    </div>`;
}

/* ---------------- Dang nhap ---------------- */
function renderLogin() {
  const notice = state.loginNotice || '';
  root.innerHTML = `
    <div class="card login-card">
      ${notice ? `<div class="error-msg" style="margin-bottom:14px; font-weight:600;">${escapeHtml(notice)}</div>` : ''}
      <div class="field">
        <label>Email</label>
        <input id="in-user" type="email" placeholder="email@vidu.com" autocomplete="username" />
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input id="in-pass" type="password" placeholder="Mật khẩu" autocomplete="current-password" />
      </div>
      <div class="error-msg" id="login-error"></div>
      <button class="btn btn-primary btn-block" id="btn-login">Đăng nhập</button>
    </div>
  `;
  state.loginNotice = '';
  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('in-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const email = document.getElementById('in-user').value.trim();
  const pass = document.getElementById('in-pass').value;
  const err = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Vui lòng nhập đầy đủ email và mật khẩu.'; return; }
  btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    const mySessionId = genSessionId();
    localStorage.setItem('tv_session_id', mySessionId);
    await db.collection(USERS_COLLECTION).doc(uid).set({
      email: email, activeSessionId: mySessionId,
      lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
    startSessionWatcher(uid, mySessionId);
    go('dashboard');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Đăng nhập';
    const map = {
      'auth/invalid-email': 'Email không hợp lệ.', 'auth/user-not-found': 'Tài khoản không tồn tại.',
      'auth/wrong-password': 'Sai mật khẩu.', 'auth/invalid-credential': 'Sai email hoặc mật khẩu.',
      'auth/too-many-requests': 'Bạn thử sai quá nhiều lần, vui lòng thử lại sau.',
    };
    err.textContent = map[e.code] || ('Đăng nhập thất bại (' + e.code + ')');
  }
}

function renderDashboard() {
  const tiles = TV_CHAPTERS_META.map(c => `
    <button class="unit-tile" data-ch="${c.chuong}">
      <div class="u-num">${c.chuong}</div>
      <div class="u-name">Chương ${c.chuong}</div>

    </button>`).join('');

  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="pill-header">Chọn chương để luyện tập</div>
      <div class="unit-grid">${tiles}</div>
    </div>
    <footer class="app-footer">Đã đăng nhập: ${escapeHtml((auth.currentUser && auth.currentUser.email) || '')} · <a href="#" id="logout-link">Đăng xuất</a></footer>
  `;
  root.querySelectorAll('.unit-tile[data-ch]').forEach(el => {

  });

}

function startTest(chNo) {
  const source = TV_ALL_TESTS[String(chNo)];
  const questions = JSON.parse(JSON.stringify(source));
  go('quiz', { quiz: { questions, index: 0, answers: {}, chNo } });
}

/* ---------------- Lam bai: hien dung/sai ngay sau khi chon ---------------- */
function renderQuiz() {
  const { questions, index, answers, chNo } = state.quiz;
  const q = questions[index];
  const total = questions.length;
  const selected = answers[q.q_num];
  const answered = selected !== undefined;

  const optionsHtml = q.options.map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    const isSel = selected === opt;
    let cls = isSel ? 'selected' : '';
    if (answered) cls = opt === q.answer ? 'correct' : (isSel ? 'wrong' : '');
    const mark = answered && opt === q.answer ? '<span class="opt-mark">✓</span>' : (answered && isSel ? '<span class="opt-mark">✗</span>' : '');
    return `
      <button class="option ${cls}" data-opt="${escapeAttr(opt)}" ${answered ? 'disabled' : ''}>
        <span class="opt-letter">${letter}</span>
        <span>${escapeHtml(opt)}</span>
        ${mark}
      </button>`;
  }).join('');

  const isLast = index === total - 1;
  const kindLabel = q.type === 'J2V' ? 'Nhật → Việt' : 'Việt → Nhật';
  const feedback = !answered ? '' : (selected === q.answer
    ? `<div class="answer-feedback answer-feedback--ok">✓ Chính xác!</div>`
    : `<div class="answer-feedback answer-feedback--bad">✗ Chưa đúng. Đáp án đúng: <b>${escapeHtml(q.answer)}</b></div>`);

  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${(index / total) * 100}%"></div></div>
        <div class="progress-label">Câu ${index + 1}/${total}</div>
      </div>
      <div class="q-number-badge">${q.q_num}</div>
      <div style="font-size:0.78rem; color:var(--terracotta); font-weight:600; margin-bottom:6px;">${kindLabel}</div>
      <div class="q-prompt">${formatPrompt(q)}</div>
      <div class="option-list">${optionsHtml}</div>
      ${feedback}
      <div class="quiz-nav">
        <button class="btn btn-ghost" id="btn-prev" ${index === 0 ? 'disabled' : ''}>← Câu trước</button>
        <button class="btn btn-primary" id="btn-next" ${answered ? '' : 'disabled'}>${isLast ? 'Nộp bài' : 'Câu tiếp →'}</button>
      </div>
    </div>
  `;

  root.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', () => {
      if (state.quiz.answers[q.q_num] !== undefined) return;
      state.quiz.answers[q.q_num] = el.dataset.opt;
      renderQuiz();
    });
  });
  document.getElementById('btn-prev').addEventListener('click', () => { state.quiz.index = Math.max(0, index - 1); renderQuiz(); });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (isLast) { submitQuiz(); } else { state.quiz.index = index + 1; renderQuiz(); }
  });
}

function submitQuiz() {
  const { questions, answers, chNo } = state.quiz;
  let correct = 0;
  const detail = questions.map(q => {
    const your = answers[q.q_num];
    const ok = your === q.answer;
    if (ok) correct++;
    return Object.assign({}, q, { your, ok });
  });
  saveAttempt(chNo, correct, questions.length);
  go('result', { lastResult: { correct, total: questions.length, detail, chNo } });
}

function saveAttempt(chNo, correct, total) {
  const user = auth.currentUser;
  if (!user) return;
  db.collection(USERS_COLLECTION).doc(user.uid).collection('attempts').add({
    chapter: chNo, score: correct, total: total,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  }).catch(err => console.error('Khong luu duoc lich su:', err));
}

/* ---------------- Ket qua ---------------- */
function renderResult() {
  const { correct, total, detail, chNo } = state.lastResult;
  const pct = Math.round((correct / total) * 100);
  const items = detail.map(d => `
    <div class="review-item ${d.ok ? 'correct' : 'wrong'}">
      <div class="r-prompt">Câu ${d.q_num}: ${formatPrompt(d)}</div>
      ${d.ok
        ? `<div class="r-line correct-ans">✓ Bạn chọn đúng: ${escapeHtml(d.answer)}</div>`
        : `<div class="r-line your">✗ Bạn chọn: ${escapeHtml(d.your || '(bỏ trống)')}</div>
           <div class="r-line correct-ans">✓ Đáp án đúng: ${escapeHtml(d.answer)}</div>`}
    </div>
  `).join('');

  root.innerHTML = `
    ${brandHeader()}
    <div class="card">
      <div class="score-hero">
        <div class="score-num">${correct}/${total}</div>
        <div class="score-sub">${pct}% chính xác — Chương ${chNo}</div>
      </div>
      <div style="display:flex; gap:12px; justify-content:center; margin-bottom:26px;">
        <button class="btn btn-primary" id="btn-retry">Làm lại chương này</button>
        <button class="btn btn-ghost" id="btn-home">Về danh sách chương</button>
      </div>
      <div class="pill-header">Xem lại đáp án</div>
      ${items}
    </div>
  `;
  document.getElementById('btn-retry').addEventListener('click', () => startTest(chNo));
  document.getElementById('btn-home').addEventListener('click', () => go('dashboard'));
}

/* ---------------- Dieu huong chinh ---------------- */
function render() {
  if (state.screen === 'login') return renderLogin();
  if (state.screen === 'dashboard') return renderDashboard();
  if (state.screen === 'quiz') return renderQuiz();
  if (state.screen === 'result') return renderResult();
}

auth.onAuthStateChanged(async (user) => {
  if (!user) { go('login'); return; }
  const mySessionId = localStorage.getItem('tv_session_id');
  if (!mySessionId) { go('login'); return; }
  try {
    const doc = await db.collection(USERS_COLLECTION).doc(user.uid).get();
    const data = doc.data();
    if (data && data.activeSessionId === mySessionId) {
      startSessionWatcher(user.uid, mySessionId);
      go('dashboard');
    } else {
      forceLogout('Tài khoản này đã được đăng nhập ở một thiết bị khác.');
    }
  } catch (e) {
    go('login');
  }
});

</script>
